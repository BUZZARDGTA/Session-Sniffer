        function buildPlayerSummary(columnKeys, row) {
            let username = '';
            let ip = '';
            const usernameKeys = ['Usernames', 'Username', 'Name'];
            const ipKeys = ['IP Address', 'IP'];

            for (const key of usernameKeys) {
                const index = columnKeys.indexOf(key);
                if (index !== -1 && row[index] && String(row[index]).trim()) {
                    username = String(row[index]).trim();
                    break;
                }
            }

            for (const key of ipKeys) {
                const index = columnKeys.indexOf(key);
                if (index !== -1 && row[index] && String(row[index]).trim()) {
                    ip = String(row[index]).trim();
                    break;
                }
            }

            if (!ip) {
                const ipCandidate = row.find(value => typeof value === 'string' && /^\d+\.\d+\.\d+\.\d+$/.test(value));
                if (ipCandidate) {
                    ip = ipCandidate;
                }
            }

            return {
                title: username || ip || (currentI18n.player || 'Player'),
                ip,
                username,
            };
        }

        function extractTargetFromElement(element) {
            if (!element || !lastSnapshotData) {
                return null;
            }
            const rowEl = element.closest('tr[data-section][data-row-index], .player-card[data-section][data-row-index]');
            if (!rowEl) {
                return null;
            }
            const sectionKey = rowEl.dataset.section;
            const rowIndex = Number.parseInt(rowEl.dataset.rowIndex, 10);
            const activeSection = sectionKey ? getActiveSectionTable(lastSnapshotData, sectionKey) : { table: null, sessionId: null };
            const tableData = activeSection.table;
            if (!tableData || !Array.isArray(tableData.rows) || Number.isNaN(rowIndex) || rowIndex < 0 || rowIndex >= tableData.rows.length) {
                return null;
            }

            const row = tableData.rows[rowIndex] || [];
            const columns = tableData.columns || [];
            const columnKeys = tableData.column_keys || columns;
            const meta = (Array.isArray(tableData.meta) && tableData.meta[rowIndex]) || {};
            const summary = buildPlayerSummary(columnKeys, row);
            const playerKey = rowEl.dataset.playerKey || `${summary.ip || 'unknown'}|${summary.title}`;

            let colIndex = -1;
            let colKey = '';
            let colLabel = '';
            let cellText = '';
            const cellEl = element.closest('td[data-col-index], .player-detail-row[data-col-index]');
            if (cellEl) {
                const parsedCol = Number.parseInt(cellEl.dataset.colIndex, 10);
                if (!Number.isNaN(parsedCol) && parsedCol >= 0 && parsedCol < columns.length) {
                    colIndex = parsedCol;
                    colKey = columnKeys[parsedCol] || '';
                    colLabel = columns[parsedCol] || colKey;
                    const rawVal = row[parsedCol];
                    cellText = rawVal == null ? '' : String(rawVal).trim();
                }
            }

            return {
                sectionKey,
                sessionId: activeSection.sessionId,
                playerKey,
                ip: summary.ip,
                username: summary.username,
                title: summary.title,
                colIndex,
                colKey,
                colLabel,
                cellText,
                columns: [...columns],
                columnKeys: [...columnKeys],
                row: [...row],
                meta,
            };
        }

        function formatRowForCopy(target) {
            const parts = [];
            for (let i = 0; i < target.columns.length; i++) {
                const label = target.columns[i] || target.columnKeys[i] || '';
                const rawVal = target.row[i];
                const val = rawVal == null || rawVal === '' ? (currentI18n.na || 'N/A') : String(rawVal);
                parts.push(label ? `${label}: ${val}` : val);
            }
            return parts.join(' | ');
        }

        function buildFallbackDiscordReport(target) {
            const lines = [];
            for (let i = 0; i < target.columns.length; i++) {
                const label = target.columns[i] || target.columnKeys[i] || '';
                const rawVal = target.row[i];
                const val = rawVal == null || rawVal === '' ? (currentI18n.na || 'N/A') : String(rawVal);
                lines.push(`**${label}:** \`${val}\``);
            }
            return lines.join('\n');
        }

        async function fetchPlayerDetails(ipAddress, sessionId) {
            if (!ipAddress) {
                return null;
            }
            try {
                const query = sessionId != null ? `?session_id=${encodeURIComponent(String(sessionId))}` : '';
                const response = await fetch(`/api/player/${encodeURIComponent(ipAddress)}${query}`, { cache: 'no-store' });
                if (!response.ok) {
                    return null;
                }
                return await response.json();
            } catch {
                return null;
            }
        }

        async function fetchPlayerSeenStats(ipAddress) {
            if (!ipAddress) {
                return null;
            }
            try {
                const response = await fetch(`/api/player/${encodeURIComponent(ipAddress)}/seen-stats`, { cache: 'no-store' });
                if (!response.ok) {
                    return null;
                }
                return await response.json();
            } catch {
                return null;
            }
        }

        async function fetchHostDiagnostics(ipAddress, sessionId) {
            try {
                const params = new URLSearchParams();
                if (ipAddress) {
                    params.set('ip', ipAddress);
                }
                if (sessionId != null) {
                    params.set('session_id', String(sessionId));
                }
                const query = params.toString() ? `?${params.toString()}` : '';
                const response = await fetch(`/api/host-diagnostics${query}`, { cache: 'no-store' });
                if (!response.ok) {
                    return null;
                }
                return await response.json();
            } catch {
                return null;
            }
        }

        async function fetchDiscordReportText(target) {
            const payload = await fetchPlayerDetails(target.ip, target.sessionId);
            if (payload && typeof payload.discord_report === 'string' && payload.discord_report) {
                return payload.discord_report;
            }
            return buildFallbackDiscordReport(target);
        }

        async function copyDiscordReport(target, cachedReport) {
            if (typeof cachedReport === 'string' && cachedReport) {
                await copyText(cachedReport);
                return;
            }
            if (
                navigator.clipboard
                && typeof navigator.clipboard.write === 'function'
                && typeof ClipboardItem !== 'undefined'
                && window.isSecureContext
            ) {
                try {
                    const blobPromise = fetchDiscordReportText(target).then(
                        text => new Blob([text], { type: 'text/plain' }),
                    );
                    await navigator.clipboard.write([new ClipboardItem({ 'text/plain': blobPromise })]);
                    showToast(currentI18n.copied_to_clipboard);
                    return;
                } catch {
                    // Fall through to standard async copyText fallback.
                }
            }
            const report = await fetchDiscordReportText(target);
            await copyText(report);
        }

        function syncContextTargetHighlight() {
            document.querySelectorAll('.is-context-target').forEach(el => el.classList.remove('is-context-target'));
            document.querySelectorAll('.is-context-cell').forEach(el => el.classList.remove('is-context-cell'));
            if (!contextTarget) {
                return;
            }
            const containerId = contextTarget.sectionKey === 'disconnected' ? 'disconnectedTable' : 'connectedTable';
            const container = document.getElementById(containerId);
            if (!container) {
                return;
            }
            const targets = container.querySelectorAll('[data-section][data-player-key]');
            for (const el of targets) {
                if (el.dataset.section === contextTarget.sectionKey && el.dataset.playerKey === contextTarget.playerKey) {
                    el.classList.add('is-context-target');
                    if (contextTarget.colIndex >= 0) {
                        const cell = el.querySelector(`[data-col-index="${contextTarget.colIndex}"]`);
                        if (cell) {
                            cell.classList.add('is-context-cell');
                        }
                    }
                    break;
                }
            }
        }

            const searchValue = target.cellText || target.ip || target.username;
            if (searchValue) {
                extraGroup.push({
                    label: currentI18n.search,

                    hintLtr: !target.colKey || LTR_COLUMN_KEYS.has(target.colKey),
                    icon: 'search',

            if (extraGroup.length > 0) {
                items.push({ type: 'separator' });
                items.push(...extraGroup);
            }

            return items;
        }

        function closeSiblingSubmenus(parentContainer, exceptWrap) {
            if (!parentContainer) {
                return;
            }
            const siblings = parentContainer.children;
            for (const sibling of siblings) {
                if (sibling !== exceptWrap && sibling.classList.contains('is-submenu-open')) {
                    sibling.classList.remove('is-submenu-open', 'flip-inline', 'flip-up');
                    sibling.querySelectorAll('.is-submenu-open').forEach(nested => {
                        nested.classList.remove('is-submenu-open', 'flip-inline', 'flip-up');
                    });
                }
            }
        }

        function positionDesktopSubmenu(wrap, submenuEl) {
            wrap.classList.remove('flip-inline', 'flip-up');
            if (MOBILE_MEDIA.matches) {
                return;
            }
            const rect = submenuEl.getBoundingClientRect();
            const isRtl = document.documentElement.dir === 'rtl';
            const overflowInline = isRtl ? rect.left < 8 : rect.right > window.innerWidth - 8;
            if (overflowInline) {
                wrap.classList.add('flip-inline');
            }
            const updatedRect = submenuEl.getBoundingClientRect();
            if (updatedRect.bottom > window.innerHeight - 8) {
                wrap.classList.add('flip-up');
            }
        }

        function renderContextMenuItems(container, items) {
            container.textContent = '';
            for (const item of items) {
                if (item.type === 'separator') {
                    const sep = document.createElement('div');
                    sep.className = 'context-menu-sep';
                    sep.setAttribute('role', 'separator');
                    container.appendChild(sep);
                    continue;
                }

                const wrap = document.createElement('div');
                wrap.className = 'context-menu-item-wrap';

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'context-menu-item';
                btn.setAttribute('role', 'menuitem');

                const iconHtml = item.icon && MENU_ICONS[item.icon] ? MENU_ICONS[item.icon] : '';
                const hintClass = item.hintLtr ? 'context-menu-hint ltr-value' : 'context-menu-hint';
                const hintHtml = item.hint ? `<span class="${hintClass}">${escapeHtml(item.hint)}</span>` : '';
                const hasSubmenu = Array.isArray(item.submenu) && item.submenu.length > 0;
                const arrowHtml = hasSubmenu ? SUBMENU_ARROW_SVG : '';
                btn.innerHTML = `${iconHtml}<span class="context-menu-label">${escapeHtml(item.label)}</span>${hintHtml}${arrowHtml}`;
                wrap.appendChild(btn);

                if (hasSubmenu) {
                    btn.setAttribute('aria-haspopup', 'menu');
                    btn.setAttribute('aria-expanded', 'false');
                    const submenuEl = document.createElement('div');
                    submenuEl.className = 'context-submenu';
                    submenuEl.setAttribute('role', 'menu');
                    renderContextMenuItems(submenuEl, item.submenu);
                    wrap.appendChild(submenuEl);

                    const openSub = () => {
                        closeSiblingSubmenus(container, wrap);
                        wrap.classList.add('is-submenu-open');
                        btn.setAttribute('aria-expanded', 'true');
                        positionDesktopSubmenu(wrap, submenuEl);
                    };

                    wrap.addEventListener('mouseenter', () => {
                        if (!MOBILE_MEDIA.matches) {
                            openSub();
                        }
                    });

                    btn.addEventListener('click', (event) => {
                        event.stopPropagation();
                        const nowOpen = !wrap.classList.contains('is-submenu-open');
                        closeSiblingSubmenus(container, wrap);
                        wrap.classList.toggle('is-submenu-open', nowOpen);
                        btn.setAttribute('aria-expanded', String(nowOpen));
                        if (nowOpen) {
                            if (MOBILE_MEDIA.matches) {
                                submenuEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                            } else {
                                positionDesktopSubmenu(wrap, submenuEl);
                            }
                        }
                    });
                } else {
                    btn.addEventListener('mouseenter', () => {
                        if (!MOBILE_MEDIA.matches) {
                            closeSiblingSubmenus(container, null);
                        }
                    });
                    btn.addEventListener('click', (event) => {
                        event.stopPropagation();
                        const actionFn = item.action;
                        closeContextMenu();
                        if (typeof actionFn === 'function') {
                            actionFn();
                        }
                    });
                }

                container.appendChild(wrap);
            }
        }

        function openContextMenu(target, clientX, clientY) {

            hideRichTooltip();
            const items = buildContextMenuItems(target);
            if (items.length === 0) {

            contextTarget = target;

            const backdrop = document.getElementById('contextBackdrop');
            const menu = document.getElementById('contextMenu');
            const list = document.getElementById('contextMenuList');
            const sheetTitle = document.getElementById('contextSheetTitle');
            const sheetIp = document.getElementById('contextSheetIp');

            const sheetFlagHtml = renderCountryFlagImg(target.meta && target.meta.country_code);
            if (sheetFlagHtml) {
                sheetTitle.innerHTML = `<span class="country-cell">${sheetFlagHtml}<span>${escapeHtml(target.title)}</span></span>`;
            } else {
                sheetTitle.textContent = target.title;

            if (target.ip && target.title !== target.ip) {
                sheetIp.textContent = target.ip;
                sheetIp.hidden = false;
            } else {
                sheetIp.textContent = '';
                sheetIp.hidden = true;
            }

            renderContextMenuItems(list, items);
            backdrop.hidden = false;
            menu.hidden = false;
            menu.scrollTop = 0;

            if (MOBILE_MEDIA.matches) {
                menu.style.left = '';
                menu.style.top = '';
            } else {
                const padding = 8;
                menu.style.left = `${clientX}px`;
                menu.style.top = `${clientY}px`;
                const rect = menu.getBoundingClientRect();
                let left = clientX;
                let top = clientY;
                if (left + rect.width > window.innerWidth - padding) {
                    left = Math.max(padding, window.innerWidth - rect.width - padding);
                }
                if (top + rect.height > window.innerHeight - padding) {
                    top = Math.max(padding, window.innerHeight - rect.height - padding);
                }
                if (left < padding) {
                    left = padding;
                }
                if (top < padding) {
                    top = padding;
                }
                menu.style.left = `${Math.round(left)}px`;
                menu.style.top = `${Math.round(top)}px`;
            }
        }

        function renderRateSvgChart(samples, strokeVar, gradId, formatTick) {
            const width = 600;
            const height = 140;
            const padLeft = 64;
            const padRight = 12;
            const padTop = 12;
            const padBottom = 16;
            const plotW = width - padLeft - padRight;
            const plotH = height - padTop - padBottom;

            const windowSamples = samples.slice(-60);
            const padded = windowSamples.length >= 2
                ? windowSamples
                : (windowSamples.length === 1 ? [windowSamples[0], windowSamples[0]] : [0, 0]);
            const maxSample = Math.max(...padded, 0);
            const yMax = Math.max(maxSample * 1.2, strokeVar.includes('success') ? 10 : 1024);
            const avgVal = windowSamples.length > 0
                ? windowSamples.reduce((acc, v) => acc + v, 0) / windowSamples.length
                : 0;

            const xForIndex = idx => padLeft + (padded.length > 1 ? (idx / (padded.length - 1)) * plotW : plotW);
            const yForVal = val => padTop + plotH - (Math.min(Math.max(val, 0), yMax) / yMax) * plotH;

            const points = padded.map((v, idx) => `${xForIndex(idx).toFixed(1)},${yForVal(v).toFixed(1)}`);
            const linePoints = points.join(' ');
            const areaPoints = `${xForIndex(0).toFixed(1)},${(padTop + plotH).toFixed(1)} ${linePoints} ${xForIndex(padded.length - 1).toFixed(1)},${(padTop + plotH).toFixed(1)}`;
            const avgY = yForVal(avgVal).toFixed(1);
            const lastX = xForIndex(padded.length - 1).toFixed(1);
            const lastY = yForVal(padded[padded.length - 1]).toFixed(1);

            const gridLevels = [0, 0.5, 1];
            let gridHtml = '';
            for (const ratio of gridLevels) {
                const tickVal = yMax * ratio;
                const yPos = yForVal(tickVal).toFixed(1);
                gridHtml += `<line class="rate-grid-line" x1="${padLeft}" y1="${yPos}" x2="${width - padRight}" y2="${yPos}"/>`;
                gridHtml += `<text class="rate-axis-label" x="${padLeft - 8}" y="${(Number(yPos) + 3.5).toFixed(1)}" text-anchor="end">${escapeHtml(formatTick(tickVal))}</text>`;
            }

            return `
                <svg class="rate-chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img">
                    <defs>
                        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="${strokeVar}" stop-opacity="0.34"/>
                            <stop offset="100%" stop-color="${strokeVar}" stop-opacity="0.02"/>
                        </linearGradient>
                    </defs>
                    ${gridHtml}
                    <polygon points="${areaPoints}" fill="url(#${gradId})"/>
                    <line class="rate-avg-line" x1="${padLeft}" y1="${avgY}" x2="${width - padRight}" y2="${avgY}" stroke="${strokeVar}"/>
                    <polyline points="${linePoints}" fill="none" stroke="${strokeVar}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                    <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="${strokeVar}"/>
                </svg>
            `;
        }

            if (mode === 'joins') {
                modalBody.innerHTML = renderJoinsModalBody(data && data.joins);
            } else if (mode === 'seen_stats') {
                modalBody.innerHTML = renderSeenStatsModalBody(data);
            } else if (mode === 'rates') {
                modalBody.innerHTML = renderRateGraphModalBody(target);
            } else if (mode === 'host_diagnostics') {
                modalBody.innerHTML = renderHostDiagnosticsModalBody(data);
            } else {
                modalBody.innerHTML = renderDetailsModalBody(data, target);
            }

            if (mode === 'host_diagnostics' && data && typeof data.raw_details === 'string' && data.raw_details) {
                copyBtn.hidden = false;
                copyBtn.textContent = currentI18n.copy_host_details;
                copyBtn.onclick = async () => {
                    const ok = await copyText(data.raw_details);
                    if (ok) {
                        showToast(currentI18n.copied_host_details || currentI18n.copied_to_clipboard);
                    }
                };
            } else if ((mode === 'details' || mode === 'joins') && data && typeof data.discord_report === 'string' && data.discord_report) {
                copyBtn.hidden = false;
                copyBtn.textContent = currentI18n.copy_for_discord;
                copyBtn.onclick = () => copyDiscordReport(target, data.discord_report);
            } else {
                copyBtn.hidden = true;
                copyBtn.onclick = null;
            }
        }

        async function openPlayerModal(target, mode) {
            hideRichTooltip();
            const backdrop = document.getElementById('playerModalBackdrop');
            const titleEl = document.getElementById('modalTitle');
            const subtitleEl = document.getElementById('modalSubtitle');
            const bodyEl = document.getElementById('modalBody');
            const copyBtn = document.getElementById('modalCopyDiscordBtn');

            let modeTitle = currentI18n.ip_lookup_details;
            if (mode === 'joins') {
                modeTitle = currentI18n.player_joins;
            } else if (mode === 'seen_stats') {
                modeTitle = currentI18n.seen_stats;
            } else if (mode === 'rates') {
                modeTitle = currentI18n.rate_graph;
            } else if (mode === 'host_diagnostics') {
                modeTitle = currentI18n.host_diagnostics_title;
            }

            titleEl.textContent = target.username ? `${modeTitle} — ${target.username}` : modeTitle;
            if (target.ip) {
                subtitleEl.textContent = target.ip;
                subtitleEl.hidden = false;
            } else {
                subtitleEl.textContent = '';
                subtitleEl.hidden = true;
            }

            copyBtn.hidden = true;
            copyBtn.onclick = null;
            backdrop.hidden = false;

            const requestToken = ++modalRequestToken;
            activeModalState = { mode, target, data: null };

            if (mode === 'rates') {
                renderActiveModalContent();
                return;
            }

            bodyEl.innerHTML = `<div class="loading-state">${escapeHtml(currentI18n.loading || currentI18n.waiting_for_data)}</div>`;

            let payload = null;
            if (mode === 'seen_stats') {
                payload = await fetchPlayerSeenStats(target.ip);
            } else if (mode === 'host_diagnostics') {
                payload = await fetchHostDiagnostics(target.ip, target.sessionId);
            } else {
                payload = await fetchPlayerDetails(target.ip, target.sessionId);
            }

            if (requestToken !== modalRequestToken || !activeModalState) {
                return;
            }
            activeModalState.data = payload;
            renderActiveModalContent();
        }

        function closePlayerModal() {
            const backdrop = document.getElementById('playerModalBackdrop');
            if (!backdrop || backdrop.hidden) {
                return;
            }
            backdrop.hidden = true;
            activeModalState = null;
            modalRequestToken++;
        }

        function openCardActionsMenu(button, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            const target = extractTargetFromElement(button);
            if (!target) {
                return;
            }
            const rect = button.getBoundingClientRect();
            openContextMenu(target, rect.left, rect.bottom + 4);
        }

        function setupTableContextTriggers(container) {
            if (!container) {
                return;
            }
            container.addEventListener('click', (event) => {
                const th = event.target.closest('th[data-sort-section][data-sort-col]');
                if (th) {
                    toggleColumnSort(th.dataset.sortSection, th.dataset.sortCol);
                }
            });
            container.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') {
                    return;
                }
                const th = event.target.closest('th[data-sort-section][data-sort-col]');
                if (th) {
                    event.preventDefault();
                    toggleColumnSort(th.dataset.sortSection, th.dataset.sortCol);
                }
            });
            container.addEventListener('contextmenu', (event) => {
                const target = extractTargetFromElement(event.target);
                if (!target) {
                    return;
                }
                event.preventDefault();
                openContextMenu(target, event.clientX, event.clientY);
            });

            let longPressTimer = null;
            let startX = 0;
            let startY = 0;

            const cancelLongPress = () => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            };

            container.addEventListener('touchstart', (event) => {
                cancelLongPress();
                if (event.touches.length !== 1) {
                    return;
                }
                if (event.target.closest('.player-actions-btn')) {
                    return;
                }
                const target = extractTargetFromElement(event.target);
                if (!target) {
                    return;
                }
                const touch = event.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                longPressTimer = setTimeout(() => {
                    longPressTimer = null;
                    suppressClickUntil = Date.now() + 600;
                    const selection = window.getSelection();
                    if (selection && selection.removeAllRanges) {
                        selection.removeAllRanges();
                    }
                    if (navigator.vibrate) {
                        try {
                            navigator.vibrate(12);
                        } catch {
                            // Ignore vibration restrictions on browsers that disallow it.
                        }
                    }
                    openContextMenu(target, startX, startY);
                }, LONG_PRESS_DELAY_MS);
            }, { passive: true });

            container.addEventListener('touchmove', (event) => {
                if (!longPressTimer || event.touches.length !== 1) {
                    cancelLongPress();
                    return;
                }
                const touch = event.touches[0];
                if (Math.hypot(touch.clientX - startX, touch.clientY - startY) > LONG_PRESS_MOVE_TOLERANCE_PX) {
                    cancelLongPress();
                }
            }, { passive: true });

            container.addEventListener('touchend', cancelLongPress, { passive: true });
            container.addEventListener('touchcancel', cancelLongPress, { passive: true });
        }

        function togglePlayerDetails(button) {
            if (Date.now() < suppressClickUntil) {
                return;
            }
            const card = button.closest('.player-card');
            if (!card) {
                return;
            }
            const nowOpen = card.classList.toggle('open');
            button.setAttribute('aria-expanded', String(nowOpen));
            const sectionKey = card.dataset.section;
            const playerKey = card.dataset.playerKey;
            if (sectionKey && playerKey && openCardKeys[sectionKey]) {
                if (nowOpen) {
                    openCardKeys[sectionKey].add(playerKey);
                } else {
                    openCardKeys[sectionKey].delete(playerKey);
                    if (
                        richTooltipState.anchor
                        && richTooltipState.anchor.kind === 'detail'
                        && richTooltipState.anchor.playerKey === playerKey
                    ) {
                        hideRichTooltip();
                    }
                }
            }
        }

        function escapeHtml(text) {
            const stringValue = text == null ? '' : String(text);
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;',
            };
            return stringValue.replace(/[&<>"']/g, char => map[char]);
        }

        function handleSearchChange() {
            const input = document.getElementById('searchInput');
            document.getElementById('searchClearBtn').hidden = !input.value;
            paginationState.connected.page = 1;
            paginationState.disconnected.page = 1;
            if (lastSnapshotData) {
                renderActiveTables(lastSnapshotData);
            }
        }

        function fetchSnapshotOnce() {
            return fetch('/api/snapshot', { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(updateStatus)
                .catch(e => console.error('Snapshot fetch error:', e));
        }

        function scheduleReconnect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            const delay = RECONNECT_BACKOFF_MS[Math.min(reconnectAttempt, RECONNECT_BACKOFF_MS.length - 1)];
            reconnectAttempt++;
            setConnectionState('reconnecting');
            if (reconnectAttempt >= 2) {
                showError(currentI18n.connection_error || 'Connection error - retrying...');
            }
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWebSocket();
            }, delay);
        }

        function connectWebSocket() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            if (activeWebSocket) {
                const staleSocket = activeWebSocket;
                activeWebSocket = null;
                staleSocket.onopen = null;
                staleSocket.onmessage = null;
                staleSocket.onerror = null;
                staleSocket.onclose = null;
                try {
                    staleSocket.close();
                } catch {
                    // Ignore close error on already-closed socket.
                }
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/updates`;
            const ws = new WebSocket(wsUrl);
            activeWebSocket = ws;

            ws.onopen = () => {
                if (activeWebSocket !== ws) {
                    return;
                }
                isConnected = true;
                reconnectAttempt = 0;
                lastWsMessageAt = Date.now();
                clearError();
                setConnectionState('live');
            };

            ws.onmessage = (event) => {
                if (activeWebSocket !== ws) {
                    return;
                }
                lastWsMessageAt = Date.now();
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'keep-alive') {
                        return;
                    }
                    if (data.type === 'meta') {
                        applyMeta(data);
                        return;
                    }
                    updateStatus(data);
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onerror = (error) => {
                if (activeWebSocket !== ws) {
                    return;
                }
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                if (activeWebSocket !== ws) {
                    return;
                }
                activeWebSocket = null;
                isConnected = false;
                scheduleReconnect();
            };
        }

        function triggerWakeReconnect() {
            const stale = !isConnected || (lastWsMessageAt > 0 && (Date.now() - lastWsMessageAt) > STALE_SOCKET_MS);
            if (!stale) {
                return;
            }
            reconnectAttempt = 0;
            setConnectionState('reconnecting');
            connectWebSocket();
            fetchSnapshotOnce();
        }

        function bindSectionControls(sectionKey) {
            const rowsSelect = document.getElementById(`${sectionKey}RowsSelect`);
            const prevBtn = document.getElementById(`${sectionKey}PrevPageBtn`);
            const nextBtn = document.getElementById(`${sectionKey}NextPageBtn`);
            const sortSelect = document.getElementById(`${sectionKey}SortSelect`);
            const sortDirBtn = document.getElementById(`${sectionKey}SortDirBtn`);
            const storageKey = sectionKey === 'connected' ? STORAGE_KEYS.rppConnected : STORAGE_KEYS.rppDisconnected;

            if (rowsSelect) {
                rowsSelect.value = String(paginationState[sectionKey].rowsPerPage);
                rowsSelect.addEventListener('change', () => {
                    const parsed = Number.parseInt(rowsSelect.value, 10);
                    paginationState[sectionKey].rowsPerPage = Number.isNaN(parsed) ? 0 : Math.max(0, parsed);
                    paginationState[sectionKey].page = 1;
                    writeStoredValue(storageKey, paginationState[sectionKey].rowsPerPage);
                    if (lastSnapshotData) {
                        renderActiveTables(lastSnapshotData);
                    }
                });
            }
            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    if (paginationState[sectionKey].page > 1) {
                        paginationState[sectionKey].page--;
                        if (lastSnapshotData) {
                            renderActiveTables(lastSnapshotData);
                        }
                    }
                });
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    paginationState[sectionKey].page++;
                    if (lastSnapshotData) {
                        renderActiveTables(lastSnapshotData);
                    }
                });
            }
            if (sortSelect) {
                sortSelect.addEventListener('change', () => {
                    const nextCol = sortSelect.value;
                    if (!nextCol) {
                        sortState[sectionKey].columnKey = null;
                        sortState[sectionKey].dir = null;
                    } else {
                        sortState[sectionKey].columnKey = nextCol;
                        sortState[sectionKey].dir = sortState[sectionKey].dir || 'asc';
                    }
                    paginationState[sectionKey].page = 1;
                    if (lastSnapshotData) {
                        renderActiveTables(lastSnapshotData);
                    }
                });
            }
            if (sortDirBtn) {
                sortDirBtn.addEventListener('click', () => {
                    if (!sortState[sectionKey].columnKey) {
                        return;
                    }
                    sortState[sectionKey].dir = sortState[sectionKey].dir === 'desc' ? 'asc' : 'desc';
                    paginationState[sectionKey].page = 1;
                    if (lastSnapshotData) {
                        renderActiveTables(lastSnapshotData);
                    }
                });
            }
        }

        window.addEventListener('load', () => {
            const searchInput = document.getElementById('searchInput');
            const searchClearBtn = document.getElementById('searchClearBtn');
            const searchColumn = document.getElementById('searchColumn');
            const sessionFilterSelect = document.getElementById('sessionFilterSelect');
            const contextBackdrop = document.getElementById('contextBackdrop');
            const contextSheetCloseBtn = document.getElementById('contextSheetCloseBtn');
            const modalBackdrop = document.getElementById('playerModalBackdrop');
            const modalBody = document.getElementById('modalBody');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalCloseFooterBtn = document.getElementById('modalCloseFooterBtn');

            syncMergeUi();
            initRichTooltips();
            setConnectionState('connecting');
            bindSectionControls('connected');
            bindSectionControls('disconnected');

            if (sessionFilterSelect) {
                sessionFilterSelect.addEventListener('change', () => {
                    selectedDisconnectedSessionId = sessionFilterSelect.value || 'current';
                    paginationState.disconnected.page = 1;
                    closeContextMenu();
                    syncMergeUi();
                    if (lastSnapshotData) {
                        renderActiveTables(lastSnapshotData);
                    }
                });
            }

            setupTableContextTriggers(document.getElementById('connectedTable'));
            setupTableContextTriggers(document.getElementById('disconnectedTable'));

            contextBackdrop.addEventListener('click', closeContextMenu);
            contextBackdrop.addEventListener('contextmenu', (event) => {
                event.preventDefault();
                closeContextMenu();
            });
            contextSheetCloseBtn.addEventListener('click', closeContextMenu);

            modalBackdrop.addEventListener('click', (event) => {
                if (event.target === modalBackdrop) {
                    closePlayerModal();
                }
            });
            modalBody.addEventListener('click', (event) => {
                const copyBtn = event.target.closest('[data-copy-text]');
                if (copyBtn) {
                    copyText(copyBtn.getAttribute('data-copy-text') || '');
                }
            });
            modalCloseBtn.addEventListener('click', closePlayerModal);
            modalCloseFooterBtn.addEventListener('click', closePlayerModal);

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    hideRichTooltip();
                    if (!document.getElementById('contextMenu').hidden) {
                        event.preventDefault();
                        closeContextMenu();
                        return;
                    }
                    if (!modalBackdrop.hidden) {
                        event.preventDefault();
                        closePlayerModal();
                    }
                } else if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === 'm') {
                    const activeEl = document.activeElement;
                    const isEditableFocused = activeEl && (
                        activeEl.tagName === 'INPUT'
                        || activeEl.tagName === 'TEXTAREA'
                        || activeEl.tagName === 'SELECT'
                        || activeEl.isContentEditable
                    );
                    if (!isEditableFocused && modalBackdrop.hidden) {
                        event.preventDefault();
                        toggleWebMerge();
                    }
                } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'c') {
                    const activeEl = document.activeElement;
                    const isInputFocused = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable);
                    const hasNativeSelection = Boolean(window.getSelection && window.getSelection().toString());
                    if (!isInputFocused && !hasNativeSelection && contextTarget) {
                        event.preventDefault();
                        const textToCopy = contextTarget.cellText || contextTarget.ip || formatRowForCopy(contextTarget);
                        closeContextMenu();
                        copyText(textToCopy);
                    }
                }
            });

            window.addEventListener('resize', closeContextMenu);
            window.addEventListener('scroll', (event) => {
                if (MOBILE_MEDIA.matches || document.getElementById('contextMenu').hidden) {
                    return;
                }
                if (event.target instanceof Element && event.target.closest('#contextMenu')) {
                    return;
                }
                if (Date.now() < ignoreTableScrollUntil) {
                    return;
                }
                closeContextMenu();
            }, true);

            searchInput.addEventListener('input', handleSearchChange);
            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    if (searchInput.value) {
                        searchInput.value = '';
                        handleSearchChange();
                    } else {
                        searchInput.blur();
                    }
                }
            });
            searchClearBtn.addEventListener('click', () => {
                searchInput.value = '';
                handleSearchChange();
                searchInput.focus();
            });
            searchColumn.addEventListener('change', handleSearchChange);
            MOBILE_MEDIA.addEventListener('change', () => {
                hideRichTooltip();
                closeContextMenu();
                applyDesktopLayout();
                if (lastSnapshotData) {
                    renderActiveTables(lastSnapshotData);
                }
                if (activeModalState && activeModalState.mode === 'joins' && activeModalState.data) {
                    renderActiveModalContent();
                }
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    triggerWakeReconnect();
                }
            });
            window.addEventListener('online', triggerWakeReconnect);
            window.addEventListener('offline', () => {
                isConnected = false;
                setConnectionState('reconnecting');
            });

            connectWebSocket();

            // Fallback: Poll REST API every 5 seconds if WebSocket fails
            setInterval(() => {
                if (!isConnected) {
                    fetchSnapshotOnce();
                }
            }, 5000);
        });
    </script>
</body>
