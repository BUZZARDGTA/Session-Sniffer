<!DOCTYPE html>
<html lang="en" dir="ltr" data-scheme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#252526">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Session Sniffer">
    <title>Session Sniffer Web Panel</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <style>
        :root {
            color-scheme: dark;
            --ss-background: #121212;
            --ss-background-rgb: 18, 18, 18;
            --ss-surface: #1e1e1e;
            --ss-surface-rgb: 30, 30, 30;
            --ss-menubar: #252526;
            --ss-menubar-rgb: 37, 37, 38;
            --ss-statusbar: #252526;
            --ss-statusbar-rgb: 37, 37, 38;
            --ss-popup: #252526;
            --ss-popup-rgb: 37, 37, 38;
            --ss-control: #2d2d30;
            --ss-control-rgb: 45, 45, 48;
            --ss-input: #1e1e1e;
            --ss-input-rgb: 30, 30, 30;
            --ss-scrollbar: #424242;
            --ss-scrollbar-rgb: 66, 66, 66;
            --ss-border: #3e3e42;
            --ss-border-rgb: 62, 62, 66;
            --ss-table: #1e1e1e;
            --ss-table-rgb: 30, 30, 30;
            --ss-table-alt: #252526;
            --ss-table-alt-rgb: 37, 37, 38;
            --ss-table-header: #2d2d30;
            --ss-table-header-rgb: 45, 45, 48;
            --ss-selection: #1f4260;
            --ss-selection-rgb: 31, 66, 96;
            --ss-text: #e0e0e0;
            --ss-text-rgb: 224, 224, 224;
            --ss-text-muted: #9ca3af;
            --ss-text-muted-rgb: 156, 163, 175;
            --ss-text-strong: #ffffff;
            --ss-text-strong-rgb: 255, 255, 255;
            --ss-accent: #007acc;
            --ss-accent-rgb: 0, 122, 204;
            --ss-success: #22c55e;
            --ss-success-rgb: 34, 197, 94;
            --ss-warning: #f59e0b;
            --ss-warning-rgb: 245, 158, 11;
            --ss-danger: #ef4444;
            --ss-danger-rgb: 239, 68, 68;
            --ss-header-badge-bg: rgba(255, 255, 255, 0.06);
            --ss-header-badge-border: rgba(255, 255, 255, 0.10);
            --ss-header-card-bg: rgba(255, 255, 255, 0.03);
            --ss-header-card-border: rgba(255, 255, 255, 0.08);
            --ss-status-pill-bg: rgba(255, 255, 255, 0.04);
            --ss-status-pill-border: rgba(255, 255, 255, 0.09);
            --ss-header-subtitle: #64748b;
            --ss-header-subtitle-hi: #22c55e;
            --ss-header-stat-value: #22c55e;
            --ss-stopped-fg: #ef4444;
            --ss-stopped-bg: rgba(239, 68, 68, 0.12);
            --ss-stopped-border: rgba(239, 68, 68, 0.35);
            --ss-search-bg: rgba(255, 255, 255, 0.04);
            --ss-search-bg-hover: rgba(255, 255, 255, 0.06);
            --ss-search-bg-focus: rgba(0, 0, 0, 0.45);
            --ss-search-border: rgba(255, 255, 255, 0.10);
            --ss-search-border-hover: rgba(255, 255, 255, 0.18);
            --ss-control-hover: #3e3e42;
            --ss-control-pressed: #1e1e1e;
            --ss-accent-text: #88c0d0;
            --ss-status-accent: #88c0d0;
            --ss-status-success: #22c55e;
            --ss-status-warning: #f59e0b;
            --ss-status-danger: #ef4444;
            --ss-connected-bar-top: #12271d;
            --ss-connected-bar-bottom: #0c1612;
            --ss-connected-border: #1c4f32;
            --ss-connected-table-bg: #101412;
            --ss-connected-table-alt: #131915;
            --ss-connected-grid: #18241d;
            --ss-connected-selection: #1a3826;
            --ss-connected-col-header-bg: #141d17;
            --ss-connected-col-header-text: #94a3b8;
            --ss-connected-accent-text: #22c55e;
            --ss-connected-badge-bg: rgba(34, 197, 94, 0.14);
            --ss-connected-badge-border: rgba(34, 197, 94, 0.36);
            --ss-connected-empty-title: #e2e8f0;
            --ss-connected-empty-subtitle: #64748b;
            --ss-disconnected-bar-top: #2a181a;
            --ss-disconnected-bar-bottom: #180f11;
            --ss-disconnected-border: #59282a;
            --ss-disconnected-table-bg: #180e11;
            --ss-disconnected-table-alt: #241317;
            --ss-disconnected-grid: #2d181c;
            --ss-disconnected-selection: #3d1a1e;
            --ss-disconnected-col-header-bg: #1d1315;
            --ss-disconnected-col-header-text: #94a3b8;
            --ss-disconnected-accent-text: #ef4444;
            --ss-disconnected-badge-bg: rgba(239, 68, 68, 0.14);
            --ss-disconnected-badge-border: rgba(239, 68, 68, 0.36);
            --ss-disconnected-empty-title: #e2e8f0;
            --ss-disconnected-empty-subtitle: #64748b;
            --ss-looky-text: #c084fc;
            --ss-disconnected-looky-text: #a855f7;
            --ss-scrollbar-track: #111215;
            --ss-scrollbar-thumb: #2a2d36;
            --ss-scrollbar-thumb-hover: #3d4250;
            --ss-on-accent: #ffffff;
            --ss-on-success: #0b0d10;
            --ss-on-danger: #ffffff;
            --ss-shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.28);
            --ss-shadow-md: 0 12px 32px rgba(0, 0, 0, 0.36);
            --ss-font-sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
            --ss-font-mono: 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background-color: var(--ss-background);
            color: var(--ss-text);
            font-family: var(--ss-font-sans);
            font-size: 13px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        [hidden] {
            display: none !important;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--ss-background);
            color: var(--ss-text);
        }

        .main-workspace {
            flex: 1 1 auto;
            width: 100%;
            max-width: 1680px;
            margin: 0 auto;
            padding: 12px 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        /* -------------------------------------------------------------------
           Main Application Header (mirrors SessionHeader in _main_header.py)
           ------------------------------------------------------------------- */
        .app-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            padding: 4px 2px;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            color: var(--ss-header-subtitle-hi);
        }

        .brand-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .app-title {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.15;
            color: var(--ss-text-strong);
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .version-badge {
            font-family: var(--ss-font-mono);
            font-size: 10.5px;
            font-weight: 500;
            color: var(--ss-text-muted);
            background-color: var(--ss-header-badge-bg);
            border: 1px solid var(--ss-header-badge-border);
            border-radius: 4px;
            padding: 1px 6px;
            white-space: nowrap;
        }

        .stopped-badge {
            color: var(--ss-stopped-fg);
            background-color: var(--ss-stopped-bg);
            border: 1px solid var(--ss-stopped-border);
            border-radius: 4px;
            padding: 1px 7px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .app-subtitle {
            font-size: 11.5px;
            color: var(--ss-header-subtitle);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .subtitle-hi {
            color: var(--ss-header-subtitle-hi);
            font-weight: 600;
        }

        /* Center: Global Search & Column Selector */
        .search-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 340px;
            max-width: 100%;
        }

        .search-icon {
            position: absolute;
            inset-inline-start: 9px;
            width: 14px;
            height: 14px;
            color: var(--ss-text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            height: 30px;
            padding-block: 0;
            padding-inline-start: 30px;
            padding-inline-end: 28px;
            color: var(--ss-text);
            background-color: var(--ss-search-bg);
            border: 1px solid var(--ss-search-border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: background-color 0.14s ease, border-color 0.14s ease;
        }

        .search-input::placeholder {
            color: var(--ss-text-muted);
        }

        .search-input:hover {
            background-color: var(--ss-search-bg-hover);
            border-color: var(--ss-search-border-hover);
        }

        .search-input:focus {
            background-color: var(--ss-search-bg-focus);
            border-color: var(--ss-success);
        }

        .search-input::-webkit-search-cancel-button {
            -webkit-appearance: none;
            appearance: none;
        }

        .search-clear-btn {
            position: absolute;
            inset-inline-end: 4px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--ss-text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.14s ease, color 0.14s ease;
        }

        .search-clear-btn:hover {
            background-color: var(--ss-control-hover);
            color: var(--ss-text-strong);
        }

        .search-select {
            height: 30px;
            min-width: 128px;
            max-width: 185px;
            padding-block: 0;
            padding-inline-start: 10px;
            padding-inline-end: 24px;
            color: var(--ss-text);
            background-color: var(--ss-search-bg);
            border: 1px solid var(--ss-search-border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.14s ease, border-color 0.14s ease;
        }

        .search-select:hover {
            background-color: var(--ss-search-bg-hover);
            border-color: var(--ss-search-border-hover);
        }

        .search-select:focus {
            border-color: var(--ss-success);
        }

        .search-select option {
            background-color: var(--ss-popup);
            color: var(--ss-text);
        }

        /* Right: Live Metrics Card */
        .metrics-col {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            min-width: 0;
        }

        .stats-card {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 5px 12px 5px 10px;
            background-color: var(--ss-header-card-bg);
            border: 1px solid var(--ss-header-card-border);
            border-radius: 8px;
            white-space: nowrap;
        }

        .stats-pulse {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: var(--ss-header-stat-value);
            transition: color 0.18s ease;
        }

        .stats-pulse.is-stopped {
            color: var(--ss-stopped-fg);
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--ss-header-subtitle);
            letter-spacing: 0.3px;
            line-height: 1.1;
        }

        .stat-value {
            font-family: var(--ss-font-mono);
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ss-header-stat-value);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .stats-divider {
            width: 1px;
            height: 24px;
            background-color: var(--ss-header-card-border);
            flex-shrink: 0;
        }

        /* Error Banner */
        .error-banner {
            background-color: var(--ss-stopped-bg);
            border: 1px solid var(--ss-stopped-border);
            color: var(--ss-stopped-fg);
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* -------------------------------------------------------------------
           Tabs Bar (Connected / Disconnected)
           ------------------------------------------------------------------- */
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-button {
            flex: 1 1 180px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid var(--ss-border);
            border-top-width: 2px;
            background-color: var(--ss-control);
            color: var(--ss-text-muted);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
        }

        .tab-button:hover {
            background-color: var(--ss-control-hover);
            color: var(--ss-text-strong);
        }

        .tab-button.tab-connected.active {
            background: linear-gradient(180deg, var(--ss-connected-bar-top), var(--ss-connected-bar-bottom));
            border-color: var(--ss-connected-border);
            border-top-color: var(--ss-success);
            color: var(--ss-text-strong);
        }

        .tab-button.tab-disconnected.active {
            background: linear-gradient(180deg, var(--ss-disconnected-bar-top), var(--ss-disconnected-bar-bottom));
            border-color: var(--ss-disconnected-border);
            border-top-color: var(--ss-danger);
            color: var(--ss-text-strong);
        }

        .tab-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .tab-connected .tab-icon {
            color: var(--ss-connected-accent-text);
        }

        .tab-disconnected .tab-icon {
            color: var(--ss-disconnected-accent-text);
        }

        .tab-count {
            font-family: var(--ss-font-mono);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
            border: 1px solid transparent;
        }

        .tab-connected .tab-count {
            background-color: var(--ss-connected-badge-bg);
            border-color: var(--ss-connected-badge-border);
            color: var(--ss-connected-accent-text);
        }

        .tab-disconnected .tab-count {
            background-color: var(--ss-disconnected-badge-bg);
            border-color: var(--ss-disconnected-badge-border);
            color: var(--ss-disconnected-accent-text);
        }

        /* -------------------------------------------------------------------
           Session Section Panels (mirrors _session_table_section.py)
           ------------------------------------------------------------------- */
        .tab-content {
            display: none;
            flex: 1 1 auto;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        .section-panel {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 360px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--ss-shadow-sm);
        }

        .section-connected {
            border: 1px solid var(--ss-connected-border);
            background-color: var(--ss-connected-table-bg);
        }

        .section-disconnected {
            border: 1px solid var(--ss-disconnected-border);
            background-color: var(--ss-disconnected-table-bg);
        }

        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 40px;
            padding: 6px 12px;
            border-top-width: 2px;
            border-top-style: solid;
            border-bottom-width: 1px;
            border-bottom-style: solid;
        }

        .section-connected .section-bar {
            background: linear-gradient(180deg, var(--ss-connected-bar-top), var(--ss-connected-bar-bottom));
            border-top-color: var(--ss-success);
            border-bottom-color: var(--ss-connected-border);
        }

        .section-disconnected .section-bar {
            background: linear-gradient(180deg, var(--ss-disconnected-bar-top), var(--ss-disconnected-bar-bottom));
            border-top-color: var(--ss-danger);
            border-bottom-color: var(--ss-disconnected-border);
        }

        .section-bar-title-group {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .section-bar-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .section-connected .section-bar-icon {
            color: var(--ss-connected-accent-text);
        }

        .section-disconnected .section-bar-icon {
            color: var(--ss-disconnected-accent-text);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ss-text-strong);
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-body {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbars (mirrors _session_table_section.py) */
        .themed-scroll {
            scrollbar-width: thin;
            scrollbar-color: var(--ss-scrollbar-thumb) var(--ss-scrollbar-track);
        }

        .themed-scroll::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        .themed-scroll::-webkit-scrollbar-track,
        .themed-scroll::-webkit-scrollbar-corner {
            background-color: var(--ss-scrollbar-track);
        }

        .themed-scroll::-webkit-scrollbar-thumb {
            background-color: var(--ss-scrollbar-thumb);
            border-radius: 5px;
            border: 2px solid var(--ss-scrollbar-track);
        }

        .themed-scroll::-webkit-scrollbar-thumb:hover {
            background-color: var(--ss-scrollbar-thumb-hover);
        }

        /* -------------------------------------------------------------------
           Desktop Session Table View (> 768px)
           ------------------------------------------------------------------- */
        .table-scroll {
            flex: 1 1 auto;
            overflow: auto;
            max-height: calc(100vh - 220px);
        }

        .session-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            white-space: nowrap;
        }

        .session-table thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            border-bottom-width: 2px;
            border-bottom-style: solid;
            border-inline-end-width: 1px;
            border-inline-end-style: solid;
            user-select: none;
        }

        .section-connected .session-table thead th {
            background-color: var(--ss-connected-col-header-bg);
            color: var(--ss-connected-col-header-text);
            border-bottom-color: var(--ss-success);
            border-inline-end-color: var(--ss-connected-grid);
        }

        .section-disconnected .session-table thead th {
            background-color: var(--ss-disconnected-col-header-bg);
            color: var(--ss-disconnected-col-header-text);
            border-bottom-color: var(--ss-danger);
            border-inline-end-color: var(--ss-disconnected-grid);
        }

        .session-table thead th:last-child,
        .session-table tbody td:last-child {
            border-inline-end: none;
        }

        .session-table tbody tr {
            transition: background-color 0.1s ease;
        }

        .section-connected .session-table tbody tr {
            background-color: var(--ss-connected-table-bg);
            border-bottom: 1px solid var(--ss-connected-grid);
        }

        .section-connected .session-table tbody tr:nth-child(even) {
            background-color: var(--ss-connected-table-alt);
        }

        .section-connected .session-table tbody tr:not(.has-custom-bg):hover {
            background-color: var(--ss-connected-selection);
        }

        .section-disconnected .session-table tbody tr {
            background-color: var(--ss-disconnected-table-bg);
            border-bottom: 1px solid var(--ss-disconnected-grid);
        }

        .section-disconnected .session-table tbody tr:nth-child(even) {
            background-color: var(--ss-disconnected-table-alt);
        }

        .section-disconnected .session-table tbody tr:not(.has-custom-bg):hover {
            background-color: var(--ss-disconnected-selection);
        }

        .session-table tbody tr.has-custom-bg:hover {
            filter: brightness(1.08);
        }

        .session-table tbody td {
            padding: 6px 10px;
            border-inline-end-width: 1px;
            border-inline-end-style: solid;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-connected .session-table tbody td {
            border-inline-end-color: var(--ss-connected-grid);
        }

        .section-disconnected .session-table tbody td {
            border-inline-end-color: var(--ss-disconnected-grid);
        }

        .session-table tbody td.num {
            text-align: end;
            font-family: var(--ss-font-mono);
            font-variant-numeric: tabular-nums;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .ltr-value {
            direction: ltr;
            unicode-bidi: isolate;
        }

        /* -------------------------------------------------------------------
           Mobile Expandable Player Cards View (<= 768px)
           ------------------------------------------------------------------- */
        .card-list {
            flex: 1 1 auto;
            overflow-y: auto;
            max-height: calc(100vh - 280px);
        }

        .player-card {
            border-bottom-width: 1px;
            border-bottom-style: solid;
            border-inline-start-width: 4px;
            border-inline-start-style: solid;
            transition: background-color 0.14s ease;
        }

        .section-connected .player-card {
            background-color: var(--ss-connected-table-bg);
            border-bottom-color: var(--ss-connected-grid);
            border-inline-start-color: var(--ss-success);
        }

        .section-connected .player-card:nth-child(even) {
            background-color: var(--ss-connected-table-alt);
        }

        .section-disconnected .player-card {
            background-color: var(--ss-disconnected-table-bg);
            border-bottom-color: var(--ss-disconnected-grid);
            border-inline-start-color: var(--ss-danger);
        }

        .section-disconnected .player-card:nth-child(even) {
            background-color: var(--ss-disconnected-table-alt);
        }

        .player-summary-row {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .player-summary {
            flex: 1 1 auto;
            min-width: 0;
            text-align: start;
            border: none;
            background: transparent;
            color: inherit;
            padding: 13px 6px 13px 14px;
            padding-inline-start: 14px;
            padding-inline-end: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .player-actions-btn {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            margin-inline-end: 6px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            opacity: 0.78;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.14s ease, border-color 0.14s ease, opacity 0.14s ease;
        }

        .player-actions-btn:hover,
        .player-actions-btn:active {
            opacity: 1;
            background-color: rgba(var(--ss-text-rgb), 0.10);
            border-color: rgba(var(--ss-border-rgb), 0.45);
        }

        .player-card.is-context-target {
            outline: 2px solid var(--ss-accent);
            outline-offset: -2px;
        }

        .session-table tbody tr.is-context-target td {
            box-shadow: inset 0 1px 0 var(--ss-accent), inset 0 -1px 0 var(--ss-accent);
        }

        .session-table tbody td.is-context-cell {
            outline: 1px solid var(--ss-accent);
            outline-offset: -1px;
        }

        .player-summary-main {
            min-width: 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 8px;
        }

        .player-summary-head {
            min-width: 0;
            max-width: 100%;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .player-summary-title {
            font-size: 13.5px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .country-cell {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            vertical-align: middle;
            max-width: 100%;
        }

        .country-flag {
            width: 20px;
            height: 14px;
            flex-shrink: 0;
            border-radius: 2px;
            object-fit: cover;
            box-shadow: 0 0 0 1px rgba(var(--ss-border-rgb), 0.45);
            vertical-align: middle;
        }

        .detail-value .country-cell {
            justify-content: flex-end;
        }

        .player-summary-ip {
            font-family: var(--ss-font-mono);
            font-size: 11.5px;
            font-weight: 600;
            opacity: 0.85;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .player-summary-chevron {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.75;
            transition: transform 0.18s ease;
        }

        .player-card.open .player-summary-chevron {
            transform: rotate(180deg);
        }

        .player-details {
            display: none;
            padding: 2px 14px 12px;
            border-top-width: 1px;
            border-top-style: solid;
        }

        .section-connected .player-details {
            border-top-color: var(--ss-connected-grid);
        }

        .section-disconnected .player-details {
            border-top-color: var(--ss-disconnected-grid);
        }

        .player-card.open .player-details {
            display: block;
        }

        .player-detail-row {
            display: grid;
            grid-template-columns: minmax(90px, auto) minmax(0, 1fr);
            gap: 12px;
            padding: 7px 0;
            border-bottom: 1px solid rgba(var(--ss-border-rgb), 0.35);
            align-items: baseline;
        }

        .player-detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--ss-text-muted);
            font-size: 11px;
            font-weight: 600;
        }

        .detail-label[data-tip-body] {
            justify-self: start;
            cursor: help;
            border-bottom: 1px dotted rgba(var(--ss-text-muted-rgb), 0.55);
            padding-bottom: 1px;
        }

        .player-card.has-custom-bg .detail-label {
            color: inherit;
            opacity: 0.78;
        }

        .player-card.has-custom-bg .detail-label[data-tip-body] {
            border-bottom-color: currentColor;
        }

        .detail-value {
            font-weight: 600;
            font-size: 12.5px;
            text-align: end;
            word-break: break-word;
        }

        .detail-value.num {
            font-family: var(--ss-font-mono);
            font-variant-numeric: tabular-nums;
            direction: ltr;
            unicode-bidi: isolate;
        }

        /* -------------------------------------------------------------------
           Empty & Loading States (mirrors tables.py _paint_empty_state)
           ------------------------------------------------------------------- */
        .empty-state,
        .loading-state {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 56px 20px;
            gap: 6px;
        }

        .empty-state-icon {
            width: 38px;
            height: 38px;
            margin-bottom: 8px;
            opacity: 0.72;
        }

        .section-connected .empty-state-icon {
            color: var(--ss-connected-empty-subtitle);
        }

        .section-disconnected .empty-state-icon {
            color: var(--ss-disconnected-empty-subtitle);
        }

        .empty-state-title {
            font-size: 14.5px;
            font-weight: 600;
        }

        .section-connected .empty-state-title {
            color: var(--ss-connected-empty-title);
        }

        .section-disconnected .empty-state-title {
            color: var(--ss-disconnected-empty-title);
        }

        .empty-state-subtitle {
            font-size: 12px;
        }

        .section-connected .empty-state-subtitle {
            color: var(--ss-connected-empty-subtitle);
        }

        .section-disconnected .empty-state-subtitle {
            color: var(--ss-disconnected-empty-subtitle);
        }

        .loading-state {
            color: var(--ss-accent-text);
            font-size: 13px;
            font-weight: 600;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.55;
            }

            50% {
                opacity: 1;
            }
        }

        /* -------------------------------------------------------------------
           Bottom Status Bar (telemetry pill dock matching header stats-card)
           ------------------------------------------------------------------- */
        .status-bar {
            flex: 0 0 auto;
            background-color: var(--ss-statusbar);
            border-top: 1px solid var(--ss-border);
            color: var(--ss-text);
            padding: 5px 14px calc(5px + env(safe-area-inset-bottom));
            font-size: 11.5px;
            line-height: 1.3;
        }

        .status-bar-inner {
            max-width: 1680px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 8px;
        }

        .status-group {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 24px;
            padding: 2px 10px;
            border-radius: 7px;
            background-color: var(--ss-status-pill-bg);
            border: 1px solid var(--ss-status-pill-border);
            max-width: 100%;
            min-width: 0;
        }

        .status-group-performance {
            margin-inline-start: auto;
        }

        .status-group-issues {
            background-color: var(--ss-stopped-bg);
            border-color: var(--ss-stopped-border);
        }

        .status-group-icon {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            color: var(--ss-status-accent);
            opacity: 0.92;
        }

        .status-group-capture .status-group-icon {
            color: var(--ss-status-success);
        }

        .status-group-capture.is-stopped .status-group-icon {
            color: var(--ss-status-danger);
        }

        .status-group-issues .status-group-icon {
            color: var(--ss-status-danger);
        }

        .status-group-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--ss-status-danger);
            white-space: nowrap;
        }

        .status-items {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
            min-width: 0;
        }

        .status-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            white-space: nowrap;
            max-width: 100%;
        }

        @media (min-width: 769px) {
            .status-item + .status-item {
                position: relative;
                padding-inline-start: 10px;
            }

            .status-item + .status-item::before {
                content: '';
                position: absolute;
                inset-inline-start: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 1px;
                height: 12px;
                background-color: var(--ss-status-pill-border);
            }
        }

        .status-item-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--ss-text-muted);
        }

        .status-item-value {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ss-text-strong);
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .status-item-value.mono {
            font-family: var(--ss-font-mono);
            font-variant-numeric: tabular-nums;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .status-item-value.tone-accent {
            color: var(--ss-status-accent);
        }

        .status-item-value.tone-success {
            color: var(--ss-status-success);
        }

        .status-item-value.tone-warning {
            color: var(--ss-status-warning);
        }

        .status-item-value.tone-danger {
            color: var(--ss-status-danger);
        }

        .status-item-value.tone-muted {
            color: var(--ss-text-muted);
            font-weight: 500;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            background-color: currentColor;
        }

        .status-item-value.tone-success .status-dot {
            box-shadow: 0 0 0 2px rgba(var(--ss-success-rgb), 0.18);
        }

        .status-item-value.tone-warning .status-dot {
            box-shadow: 0 0 0 2px rgba(var(--ss-warning-rgb), 0.18);
        }

        .status-item-value.tone-danger .status-dot {
            box-shadow: 0 0 0 2px rgba(var(--ss-danger-rgb), 0.18);
        }

        .status-placeholder {
            color: var(--ss-text-muted);
            font-size: 11.5px;
        }

        /* -------------------------------------------------------------------
           Context Menu (Desktop QMenu Popup + Mobile Bottom Sheet)
           ------------------------------------------------------------------- */
        .context-backdrop {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: transparent;
        }

        .context-menu {
            position: fixed;
            z-index: 210;
            min-width: 244px;
            max-width: min(340px, calc(100vw - 16px));
            background-color: var(--ss-popup);
            color: var(--ss-text);
            border: 1px solid var(--ss-border);
            border-radius: 6px;
            padding: 4px;
            box-shadow: var(--ss-shadow-md);
            font-size: 12.5px;
            user-select: none;
        }

        .context-sheet-handle,
        .context-sheet-header {
            display: none;
        }

        .context-menu-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .context-menu-sep {
            height: 1px;
            background-color: var(--ss-border);
            margin: 4px 8px;
        }

        .context-menu-item-wrap {
            position: relative;
        }

        .context-menu-item {
            width: 100%;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--ss-text);
            padding: 7px 10px;
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 500;
            text-align: start;
            cursor: pointer;
            transition: background-color 0.1s ease, color 0.1s ease;
        }

        .context-menu-item:hover,
        .context-menu-item:focus-visible,
        .context-menu-item-wrap.is-submenu-open > .context-menu-item {
            background-color: var(--ss-selection);
            color: var(--ss-text-strong);
            outline: none;
        }

        .context-menu-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            color: var(--ss-text-muted);
        }

        .context-menu-item:hover .context-menu-icon,
        .context-menu-item:focus-visible .context-menu-icon,
        .context-menu-item-wrap.is-submenu-open > .context-menu-item .context-menu-icon {
            color: var(--ss-text-strong);
        }

        .context-menu-label {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .context-menu-hint {
            flex: 0 1 auto;
            max-width: 140px;
            font-size: 11px;
            color: var(--ss-text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: end;
        }

        .context-menu-arrow {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            color: var(--ss-text-muted);
            transition: transform 0.16s ease;
        }

        [dir='rtl'] .context-menu-arrow {
            transform: scaleX(-1);
        }

        .context-submenu {
            display: none;
            position: absolute;
            top: -4px;
            inset-inline-start: calc(100% + 2px);
            min-width: 232px;
            max-width: min(340px, calc(100vw - 24px));
            background-color: var(--ss-popup);
            color: var(--ss-text);
            border: 1px solid var(--ss-border);
            border-radius: 6px;
            padding: 4px;
            box-shadow: var(--ss-shadow-md);
            flex-direction: column;
            gap: 1px;
            z-index: 220;
        }

        .context-menu-item-wrap.is-submenu-open > .context-submenu {
            display: flex;
        }

        .context-menu-item-wrap.flip-inline > .context-submenu {
            inset-inline-start: auto;
            inset-inline-end: calc(100% + 2px);
        }

        .context-menu-item-wrap.flip-up > .context-submenu {
            top: auto;
            bottom: -4px;
        }

        /* -------------------------------------------------------------------
           Responsive Player Details & Joins Modal / Mobile Sheet
           ------------------------------------------------------------------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.54);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .player-modal {
            width: 100%;
            max-width: 720px;
            max-height: 84vh;
            background-color: var(--ss-surface);
            color: var(--ss-text);
            border: 1px solid var(--ss-border);
            border-radius: 10px;
            box-shadow: var(--ss-shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background-color: var(--ss-menubar);
            border-bottom: 1px solid var(--ss-border);
        }

        .modal-title-group {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .modal-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--ss-text-strong);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-subtitle {
            font-family: var(--ss-font-mono);
            font-size: 11.5px;
            color: var(--ss-text-muted);
            direction: ltr;
            unicode-bidi: isolate;
        }

        .modal-close-btn {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            border: 1px solid var(--ss-border);
            border-radius: 6px;
            background-color: var(--ss-control);
            color: var(--ss-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.14s ease, color 0.14s ease;
        }

        .modal-close-btn:hover {
            background-color: var(--ss-control-hover);
            color: var(--ss-text-strong);
        }

        .modal-body {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-section {
            flex: 0 0 auto;
            background-color: var(--ss-background);
            border: 1px solid var(--ss-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .detail-section-title {
            padding: 8px 12px;
            background-color: var(--ss-table-header);
            border-bottom: 1px solid var(--ss-border);
            font-size: 12px;
            font-weight: 700;
            color: var(--ss-accent-text);
        }

        .detail-section-rows {
            padding: 4px 12px;
        }

        .modal-detail-row {
            display: grid;
            grid-template-columns: minmax(120px, 180px) minmax(0, 1fr);
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(var(--ss-border-rgb), 0.35);
            align-items: baseline;
            font-size: 12.5px;
        }

        .modal-detail-row:last-child {
            border-bottom: none;
        }

        .modal-detail-label {
            color: var(--ss-text-muted);
            font-weight: 600;
        }

        .modal-detail-value {
            color: var(--ss-text-strong);
            font-weight: 500;
            word-break: break-word;
            white-space: pre-line;
        }

        .joins-table-wrap {
            flex: 0 0 auto;
            overflow-x: auto;
            border: 1px solid var(--ss-border);
            border-radius: 8px;
            background-color: var(--ss-table);
        }

        .joins-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            white-space: nowrap;
        }

        .joins-table th {
            padding: 7px 10px;
            background-color: var(--ss-table-header);
            color: var(--ss-text-muted);
            border-bottom: 1px solid var(--ss-border);
            text-align: center;
            font-size: 11px;
            font-weight: 700;
        }

        .joins-table td {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(var(--ss-border-rgb), 0.35);
            text-align: center;
            color: var(--ss-text);
        }

        .joins-table tr:nth-child(even) td {
            background-color: var(--ss-table-alt);
        }

        .joins-table td.join-status-active,
        .join-status-active {
            color: var(--ss-connected-accent-text);
            font-weight: 700;
        }

        .joins-table td.join-status-ended,
        .join-status-ended {
            color: var(--ss-disconnected-accent-text);
            font-weight: 700;
        }

        .joins-card-list {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 16px;
            background-color: var(--ss-menubar);
            border-top: 1px solid var(--ss-border);
        }

        .modal-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 34px;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--ss-border);
            background-color: var(--ss-control);
            color: var(--ss-text-strong);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.14s ease, border-color 0.14s ease;
        }

        .modal-btn:hover {
            background-color: var(--ss-control-hover);
            border-color: var(--ss-accent);
        }

        .modal-btn-primary {
            background-color: var(--ss-accent);
            border-color: var(--ss-accent);
            color: var(--ss-on-accent);
        }

        .modal-btn-primary:hover {
            filter: brightness(1.08);
            background-color: var(--ss-accent);
        }

        /* Toast Confirmation */
        .toast-notice {
            position: fixed;
            left: 50%;
            bottom: calc(46px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 400;
            padding: 8px 16px;
            border-radius: 999px;
            background-color: var(--ss-popup);
            color: var(--ss-text-strong);
            border: 1px solid var(--ss-accent);
            box-shadow: var(--ss-shadow-md);
            font-size: 12.5px;
            font-weight: 600;
            pointer-events: none;
            white-space: nowrap;
            max-width: calc(100vw - 24px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Rich Floating Column Tooltip Portal */
        .ss-tooltip {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 360;
            max-width: min(370px, calc(100vw - 24px));
            padding: 10px 13px;
            border-radius: 9px;
            background-color: var(--ss-popup);
            border: 1px solid var(--ss-border);
            border-top: 2.5px solid var(--ss-accent);
            box-shadow: var(--ss-shadow-md);
            color: var(--ss-text);
            pointer-events: none;
            text-align: start;
        }

        .ss-tooltip.is-visible {
            display: block;
            animation: ssTooltipIn 0.14s ease-out;
        }

        .ss-tooltip.is-visible.is-updating {
            animation: none;
        }

        @keyframes ssTooltipIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ss-tooltip::before {
            content: '';
            position: absolute;
            left: var(--tip-arrow-x, 50%);
            width: 9px;
            height: 9px;
            background-color: var(--ss-popup);
            border-left: 1px solid var(--ss-border);
            border-top: 1px solid var(--ss-border);
            transform: translateX(-50%) rotate(45deg);
        }

        .ss-tooltip[data-placement='top']::before {
            bottom: -5px;
            border-left: none;
            border-top: none;
            border-right: 1px solid var(--ss-border);
            border-bottom: 1px solid var(--ss-border);
        }

        .ss-tooltip[data-placement='bottom']::before {
            top: -6px;
            border-color: var(--ss-border);
        }

        .ss-tooltip--connected {
            border-top-color: var(--ss-success);
        }

        .ss-tooltip--disconnected {
            border-top-color: var(--ss-danger);
        }

        .ss-tooltip-head {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 4px;
        }

        .ss-tooltip-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background-color: var(--ss-accent);
        }

        .ss-tooltip--connected .ss-tooltip-dot {
            background-color: var(--ss-success);
        }

        .ss-tooltip--disconnected .ss-tooltip-dot {
            background-color: var(--ss-danger);
        }

        .ss-tooltip-title {
            font-size: 12.5px;
            font-weight: 800;
            color: var(--ss-text-strong);
        }

        .ss-tooltip-body {
            margin: 0;
            font-size: 12px;
            color: var(--ss-text-muted);
            line-height: 1.48;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        /* -------------------------------------------------------------------
           Live Connection Pill, Desktop Split Toggle, Section Controls & Sorting
           ------------------------------------------------------------------- */
        .connection-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid var(--ss-header-badge-border);
            background-color: var(--ss-header-badge-bg);
            color: var(--ss-text-muted);
            transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
        }

        .connection-pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            background-color: currentColor;
        }

        .connection-pill.is-live {
            background-color: var(--ss-connected-badge-bg);
            border-color: var(--ss-connected-badge-border);
            color: var(--ss-connected-accent-text);
        }

        .connection-pill.is-live .connection-pill-dot {
            box-shadow: 0 0 0 2px rgba(var(--ss-success-rgb), 0.22);
        }

        .connection-pill.is-reconnecting {
            background-color: rgba(var(--ss-warning-rgb), 0.14);
            border-color: rgba(var(--ss-warning-rgb), 0.38);
            color: var(--ss-status-warning);
        }

        .connection-pill.is-reconnecting .connection-pill-dot {
            animation: pulse 1.1s ease-in-out infinite;
        }

        .layout-toggle-btn {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 13px;
            border-radius: 8px;
            border: 1px solid var(--ss-border);
            background-color: var(--ss-control);
            color: var(--ss-text-muted);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
        }

        .layout-toggle-btn:hover {
            background-color: var(--ss-control-hover);
            color: var(--ss-text-strong);
            border-color: var(--ss-accent);
        }

        .layout-toggle-btn.is-active {
            background-color: rgba(var(--ss-accent-rgb), 0.16);
            border-color: var(--ss-accent);
            color: var(--ss-text-strong);
        }

        .layout-toggle-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .panels-stack {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 769px) {
            body.desktop-split-view:not(.is-merged) .tab-content {
                display: flex;
                flex-direction: column;
            }

            body.desktop-split-view:not(.is-merged) .section-panel {
                min-height: 220px;
            }

            body.desktop-split-view:not(.is-merged) .table-scroll {
                max-height: calc(50vh - 148px);
                min-height: 170px;
            }
        }

        /* Section Bar Controls (Past Sessions, Pagination, Mobile Sort) */
        .section-bar {
            flex-wrap: wrap;
        }

        .section-bar-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 8px;
            margin-inline-start: auto;
        }

        .section-control-group {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
        }

        .section-control-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--ss-text-muted);
            white-space: nowrap;
        }

        .section-select {
            height: 26px;
            padding-block: 0;
            padding-inline-start: 8px;
            padding-inline-end: 20px;
            color: var(--ss-text);
            background-color: var(--ss-search-bg);
            border: 1px solid var(--ss-search-border);
            border-radius: 5px;
            font-family: inherit;
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            max-width: 240px;
            transition: background-color 0.14s ease, border-color 0.14s ease;
        }

        .section-select:hover {
            background-color: var(--ss-search-bg-hover);
            border-color: var(--ss-search-border-hover);
        }

        .section-select:focus {
            border-color: var(--ss-accent);
        }

        .section-select option {
            background-color: var(--ss-popup);
            color: var(--ss-text);
        }

        .page-nav {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .page-nav-btn {
            width: 26px;
            height: 26px;
            border-radius: 5px;
            border: 1px solid var(--ss-border);
            background-color: var(--ss-control);
            color: var(--ss-text-strong);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
        }

        .page-nav-btn:hover:not(:disabled) {
            background-color: var(--ss-control-hover);
            border-color: var(--ss-accent);
            color: var(--ss-text-strong);
        }

        .page-nav-btn:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        .page-indicator {
            font-family: var(--ss-font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--ss-text);
            padding: 0 4px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .mobile-sort-group {
            display: none;
        }

        .sort-dir-btn {
            width: 26px;
            height: 26px;
            border-radius: 5px;
            border: 1px solid var(--ss-border);
            background-color: var(--ss-control);
            color: var(--ss-text-strong);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .sort-dir-btn:hover:not(:disabled) {
            background-color: var(--ss-control-hover);
            border-color: var(--ss-accent);
        }

        .sort-dir-btn:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        .section-merge-btn {
            height: 26px;
            padding: 0 11px;
            border-radius: 6px;
            border: 1px solid var(--ss-border);
            background-color: var(--ss-control);
            color: var(--ss-text);
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
        }

        .section-merge-btn:hover {
            background-color: rgba(var(--ss-accent-rgb), 0.16);
            border-color: rgba(var(--ss-accent-rgb), 0.48);
            color: var(--ss-accent-text);
        }

        .section-merge-btn.is-merged-active {
            background-color: rgba(var(--ss-accent-rgb), 0.14);
            border-color: rgba(var(--ss-accent-rgb), 0.42);
            color: var(--ss-accent-text);
        }

        .section-merge-btn.is-merged-active:hover {
            background-color: rgba(var(--ss-accent-rgb), 0.22);
            border-color: var(--ss-accent);
            color: var(--ss-text-strong);
        }

        /* Sortable Desktop Column Headers */
        .session-table thead th.sortable-th {
            cursor: pointer;
            transition: background-color 0.12s ease, color 0.12s ease;
        }

        .section-connected .session-table thead th.sortable-th:hover {
            background-color: var(--ss-connected-selection);
            color: var(--ss-text-strong);
        }

        .section-disconnected .session-table thead th.sortable-th:hover {
            background-color: var(--ss-disconnected-selection);
            color: var(--ss-text-strong);
        }

        .session-table thead th.is-sorted {
            color: var(--ss-text-strong);
        }

        .th-inner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .sort-caret {
            font-size: 9px;
            line-height: 1;
            opacity: 0.92;
        }

        .section-connected .sort-caret {
            color: var(--ss-connected-accent-text);
        }

        .section-disconnected .sort-caret {
            color: var(--ss-disconnected-accent-text);
        }

        /* Row Status Badges (Host, Relay, High Rate, Identified, Looky) */
        .cell-with-badges {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            vertical-align: middle;
            max-width: 100%;
        }

        .row-badges {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .row-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .row-badge svg {
            width: 14px;
            height: 14px;
            display: block;
        }

        .row-badge.badge-host {
            color: var(--ss-status-warning);
        }

        .row-badge.badge-relay {
            color: var(--ss-status-accent);
        }

        .row-badge.badge-high_rate {
            color: var(--ss-status-danger);
        }

        .row-badge.badge-identified {
            color: var(--ss-accent-text);
        }

        .row-badge.badge-looky {
            color: var(--ss-text-muted);
        }

        .has-dark-bg .row-badge.badge-host {
            color: #fbbf24;
        }

        .has-dark-bg .row-badge.badge-relay {
            color: #38bdf8;
        }

        .has-dark-bg .row-badge.badge-high_rate {
            color: #f87171;
        }

        .has-dark-bg .row-badge.badge-identified {
            color: #c084fc;
        }

        .has-dark-bg .row-badge.badge-looky {
            color: rgba(255, 255, 255, 0.90);
        }

        .looky-username {
            color: var(--ss-looky-text);
        }

        .section-disconnected .looky-username,
        .is-disconnected-row .looky-username {
            color: var(--ss-disconnected-looky-text);
        }

        .has-dark-bg .looky-username {
            color: #c084fc;
        }

        .has-dark-bg.is-disconnected-row .looky-username,
        .section-disconnected .has-dark-bg .looky-username {
            color: #d8b4fe;
        }

        .player-card.has-custom-bg .row-badge {
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.45));
        }

        /* Seen Stats Modal Grid */
        .seen-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
            gap: 10px;
            padding: 12px;
        }

        .seen-stat-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 12px 10px;
            border-radius: 8px;
            background-color: var(--ss-surface);
            border: 1px solid var(--ss-border);
            text-align: center;
        }

        .seen-stat-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--ss-text-muted);
        }

        .seen-stat-value {
            font-family: var(--ss-font-mono);
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--ss-text-muted);
        }

        .seen-stat-value.has-hits {
            color: var(--ss-accent-text);
        }

        /* Live Rate Graph Modal */
        .rate-chart-card {
            flex: 0 0 auto;
            background-color: var(--ss-background);
            border: 1px solid var(--ss-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .rate-chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 12px;
            background-color: var(--ss-table-header);
            border-bottom: 1px solid var(--ss-border);
        }

        .rate-chart-title {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--ss-text-strong);
        }

        .rate-chart-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .rate-chart-stats {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 11px;
        }

        .rate-stat-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--ss-text-muted);
        }

        .rate-stat-chip strong {
            font-family: var(--ss-font-mono);
            font-variant-numeric: tabular-nums;
            color: var(--ss-text-strong);
            direction: ltr;
            unicode-bidi: isolate;
        }

        .rate-chart-svg-wrap {
            padding: 10px 12px 8px;
        }

        .rate-chart-svg {
            width: 100%;
            height: 152px;
            display: block;
            overflow: visible;
        }

        .rate-grid-line {
            stroke: var(--ss-border);
            stroke-opacity: 0.45;
            stroke-width: 1;
        }

        .rate-avg-line {
            stroke-dasharray: 4 4;
            stroke-width: 1.25;
            stroke-opacity: 0.85;
        }

        .rate-axis-label {
            fill: var(--ss-text-muted);
            font-family: var(--ss-font-mono);
            font-size: 10px;
        }

        /* Host Diagnostics Modal */
        .diag-hero {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--ss-border);
        }

        .diag-hero.is-success {
            background: linear-gradient(180deg, var(--ss-connected-bar-top), var(--ss-connected-bar-bottom));
            border-color: var(--ss-connected-border);
        }

        .diag-hero.is-failure {
            background-color: rgba(var(--ss-warning-rgb), 0.10);
            border-color: rgba(var(--ss-warning-rgb), 0.36);
        }

        .diag-hero-main {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            min-width: 0;
            flex: 1 1 240px;
        }

        .diag-hero-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .diag-hero.is-success .diag-hero-icon {
            color: var(--ss-status-warning);
        }

        .diag-hero.is-failure .diag-hero-icon {
            color: var(--ss-status-warning);
        }

        .diag-hero-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .diag-hero-title {
            font-size: 13.5px;
            font-weight: 700;
        }

        .diag-hero.is-success .diag-hero-title {
            color: var(--ss-connected-accent-text);
        }

        .diag-hero.is-failure .diag-hero-title {
            color: var(--ss-status-warning);
        }

        .diag-hero-identity {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
        }

        .diag-hero-ip {
            font-family: var(--ss-font-mono);
            font-size: 14.5px;
            font-weight: 700;
            color: var(--ss-text-strong);
            direction: ltr;
            unicode-bidi: isolate;
        }

        .diag-hero-users {
            font-size: 12px;
            color: var(--ss-text-muted);
        }

        .diag-hero-reason {
            font-size: 12px;
            color: var(--ss-text);
            white-space: pre-line;
        }

        .diag-hero-time {
            font-size: 11px;
            color: var(--ss-text-muted);
        }

        .diag-stats-row {
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .diag-stat-box {
            padding: 9px 11px;
            border-radius: 8px;
            background-color: var(--ss-background);
            border: 1px solid var(--ss-border);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .diag-stat-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--ss-text-muted);
        }

        .diag-stat-value {
            font-family: var(--ss-font-mono);
            font-size: 17px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--ss-text-strong);
        }

        .diag-stat-value.tone-accent {
            color: var(--ss-accent-text);
        }

        .diag-stat-value.tone-success {
            color: var(--ss-connected-accent-text);
        }

        .diag-stat-value.tone-muted {
            color: var(--ss-text-muted);
        }

        .diag-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            background-color: var(--ss-table-header);
            border-bottom: 1px solid var(--ss-border);
        }

        .diag-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--ss-text-strong);
        }

        .diag-pill {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid var(--ss-border);
            background-color: var(--ss-control);
            color: var(--ss-text-muted);
        }

        .diag-pill.tone-success {
            background-color: var(--ss-connected-badge-bg);
            border-color: var(--ss-connected-badge-border);
            color: var(--ss-connected-accent-text);
        }

        .diag-pill.tone-warning {
            background-color: rgba(var(--ss-warning-rgb), 0.14);
            border-color: rgba(var(--ss-warning-rgb), 0.36);
            color: var(--ss-status-warning);
        }

        .diag-pill.tone-danger {
            background-color: var(--ss-disconnected-badge-bg);
            border-color: var(--ss-disconnected-badge-border);
            color: var(--ss-disconnected-accent-text);
        }

        .diag-pill.tone-accent {
            background-color: rgba(var(--ss-accent-rgb), 0.14);
            border-color: rgba(var(--ss-accent-rgb), 0.36);
            color: var(--ss-accent-text);
        }

        .diag-checklist-list,
        .diag-candidates-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 12px;
        }

        .diag-check-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            background-color: var(--ss-surface);
            border: 1px solid var(--ss-border);
        }

        .diag-check-status {
            min-width: 46px;
            justify-content: center;
        }

        .diag-check-body {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .diag-check-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--ss-text-strong);
        }

        .diag-check-row.is-fail .diag-check-title {
            color: var(--ss-disconnected-accent-text);
        }

        .diag-check-detail {
            font-size: 11.5px;
            color: var(--ss-text-muted);
            white-space: pre-line;
        }

        .diag-candidate-card {
            padding: 10px 12px;
            border-radius: 7px;
            background-color: var(--ss-surface);
            border: 1px solid var(--ss-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .diag-candidate-card.is-host {
            border-color: var(--ss-connected-border);
            background-color: var(--ss-connected-table-bg);
        }

        .diag-candidate-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 8px;
        }

        .diag-candidate-index {
            font-family: var(--ss-font-mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--ss-text-muted);
        }

        .diag-candidate-ip {
            font-family: var(--ss-font-mono);
            font-size: 12.5px;
            font-weight: 700;
            color: var(--ss-text-strong);
            direction: ltr;
            unicode-bidi: isolate;
        }

        .diag-copy-mini {
            margin-inline-start: auto;
            height: 24px;
            padding: 0 9px;
            border-radius: 5px;
            border: 1px solid var(--ss-border);
            background-color: var(--ss-control);
            color: var(--ss-text);
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .diag-copy-mini:hover {
            background-color: var(--ss-control-hover);
            border-color: var(--ss-accent);
            color: var(--ss-text-strong);
        }

        .diag-candidate-metrics {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .diag-metric-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
            font-size: 11.5px;
        }

        .diag-metric-label {
            color: var(--ss-text-muted);
            font-weight: 600;
        }

        .diag-metric-value {
            color: var(--ss-text);
            font-family: var(--ss-font-mono);
        }

        .diag-servers-text {
            padding: 10px 12px;
            font-family: var(--ss-font-mono);
            font-size: 11.5px;
            color: var(--ss-text-muted);
            word-break: break-word;
            line-height: 1.5;
        }

        /* -------------------------------------------------------------------
           Responsive Breakpoints
           ------------------------------------------------------------------- */
        @media (max-width: 1120px) {
            .app-header {
                grid-template-columns: 1fr auto;
            }

            .search-controls {
                grid-column: 1 / -1;
                order: 3;
            }

            .search-input-wrap {
                flex: 1 1 auto;
                width: auto;
            }
        }

        @media (max-width: 768px) {
            .main-workspace {
                padding: 10px 10px 12px;
                gap: 10px;
            }

            .app-header {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .app-subtitle {
                white-space: normal;
            }

            .metrics-col {
                justify-content: flex-start;
            }

            .stats-card {
                width: 100%;
                justify-content: space-between;
            }

            .search-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input-wrap,
            .search-select {
                width: 100%;
                max-width: none;
            }

            .search-select {
                white-space: nowrap;
            }

            .tab-button {
                flex: 1 1 0;
                min-width: 0;
                padding: 9px 10px;
                gap: 6px;
            }

            .layout-toggle-btn {
                display: none !important;
            }

            .section-bar {
                padding: 8px 10px;
                gap: 8px;
            }

            .section-bar-title-group {
                order: 1;
                flex: 1 1 auto;
            }

            .section-merge-btn {
                order: 2;
                height: 28px;
                padding: 0 11px;
                font-size: 11px;
            }

            .section-bar-controls {
                order: 3;
                width: 100%;
                margin-inline-start: 0;
                justify-content: space-between;
                gap: 6px;
            }

            .section-control-group {
                flex: 1 1 auto;
            }

            .section-select {
                flex: 1 1 auto;
                min-width: 0;
                max-width: none;
