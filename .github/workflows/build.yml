name: Build New Release

on:
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            asset_name: Session_Sniffer.exe
            venv_python: .venv/Scripts/python
          - os: ubuntu-24.04
            name: Linux x64
            asset_name: Session_Sniffer
            venv_python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create virtual environment
        working-directory: .github/workflows
        run: python -m venv --upgrade-deps '.venv'

      - name: Validate release tag matches pyproject.toml
        working-directory: .github/workflows
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          committed_version=$(${{ matrix.venv_python }} -c "import tomllib; print(tomllib.loads(open('../../pyproject.toml', encoding='utf-8').read())['project']['version'])")
          if [ "$committed_version" != "$RELEASE_TAG" ]; then
            echo "::error::pyproject.toml version ('$committed_version') does not match release tag ('$RELEASE_TAG')!" >&2
            echo "::error::You must commit the updated version in pyproject.toml before publishing the release." >&2
            exit 1
          fi

      - name: Install build dependencies
        working-directory: .github/workflows
        run: |
          ${{ matrix.venv_python }} -m pip install '../..'
          ${{ matrix.venv_python }} -m pip install pyinstaller

      - name: Bake build metadata
        working-directory: .github/workflows
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: ${{ matrix.venv_python }} 'scripts/bake_build_metadata.py'

      - name: Build executable with PyInstaller
        working-directory: .github/workflows
        run: ${{ matrix.venv_python }} -m PyInstaller 'Session_Sniffer.spec'

      - name: Verify built executable
        working-directory: .github/workflows
        run: |
          ${{ matrix.venv_python }} -c "import os, sys; path = 'dist/${{ matrix.asset_name }}'; sys.exit(0 if os.path.isfile(path) else f'Missing: {path}')"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: .github/workflows/dist/${{ matrix.asset_name }}
          if-no-files-found: error

  upload-release-artifact:
    needs: [build]
    runs-on: ubuntu-24.04
    name: Upload release artifact
    outputs:
      sha256: ${{ steps.release_asset.outputs.sha256 }}
      file_size: ${{ steps.release_asset.outputs.file_size }}
      download_url: ${{ steps.release_asset.outputs.download_url }}
      linux_sha256: ${{ steps.release_asset.outputs.linux_sha256 }}
      linux_file_size: ${{ steps.release_asset.outputs.linux_file_size }}
      linux_download_url: ${{ steps.release_asset.outputs.linux_download_url }}
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets and compute release info
        id: release_asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          exe_path="artifacts/Session_Sniffer.exe"
          linux_path="artifacts/Session_Sniffer"

          if [[ ! -f "$exe_path" ]]; then
            echo "Expected Windows release asset is missing: $exe_path" >&2
            exit 1
          fi

          if [[ ! -f "$linux_path" ]]; then
            echo "Expected Linux release asset is missing: $linux_path" >&2
            exit 1
          fi

          sha256=$(sha256sum "$exe_path" | cut -d ' ' -f 1)
          file_size=$(stat -c%s "$exe_path")

          linux_sha256=$(sha256sum "$linux_path" | cut -d ' ' -f 1)
          linux_file_size=$(stat -c%s "$linux_path")

          gh release upload "$RELEASE_TAG" "$exe_path" "$linux_path" --repo "$GH_REPO" --clobber

          download_url=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
            --jq '.assets | map(select(.name == "Session_Sniffer.exe")) | if length == 1 then .[0].browser_download_url else empty end')

          if [[ -z "$download_url" ]]; then
            echo "Failed to resolve unique Session_Sniffer.exe download URL." >&2
            exit 1
          fi

          linux_download_url=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
            --jq '.assets | map(select(.name == "Session_Sniffer")) | if length == 1 then .[0].browser_download_url else empty end')

          if [[ -z "$linux_download_url" ]]; then
            echo "Failed to resolve unique Session_Sniffer download URL." >&2
            exit 1
          fi

          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "file_size=$file_size" >> "$GITHUB_OUTPUT"
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"
          echo "linux_sha256=$linux_sha256" >> "$GITHUB_OUTPUT"
          echo "linux_file_size=$linux_file_size" >> "$GITHUB_OUTPUT"
          echo "linux_download_url=$linux_download_url" >> "$GITHUB_OUTPUT"

  update-version-info:
    needs: [upload-release-artifact]
    runs-on: ubuntu-24.04
    name: Update version branch
    steps:
      - name: Checkout version branch
        uses: actions/checkout@v7.0.1
        with:
          ref: version

      - name: Checkout updater from main
        run: |
          git fetch origin main
          mkdir -p .github/workflows/scripts
          git show origin/main:.github/workflows/scripts/update_release_versions.py > .github/workflows/scripts/update_release_versions.py

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install updater dependency
        run: python -m pip install packaging

      - name: Verify updater script
        run: python -m py_compile '.github/workflows/scripts/update_release_versions.py'

      - name: Update release_versions.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          DOWNLOAD_URL: ${{ needs.upload-release-artifact.outputs.download_url }}
          SHA256: ${{ needs.upload-release-artifact.outputs.sha256 }}
          FILE_SIZE: ${{ needs.upload-release-artifact.outputs.file_size }}
          LINUX_DOWNLOAD_URL: ${{ needs.upload-release-artifact.outputs.linux_download_url }}
          LINUX_SHA256: ${{ needs.upload-release-artifact.outputs.linux_sha256 }}
          LINUX_FILE_SIZE: ${{ needs.upload-release-artifact.outputs.linux_file_size }}
        run: |
          set -euo pipefail

          prerelease_arg=()
          if [[ "$IS_PRERELEASE" == 'true' ]]; then
            prerelease_arg+=(--prerelease)
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo 'Release tag is empty.' >&2
            exit 1
          fi

          if [[ -z "$RELEASE_URL" ]]; then
            echo 'Release URL is empty.' >&2
            exit 1
          fi

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo 'Download URL is empty.' >&2
            exit 1
          fi

          if [[ -z "$SHA256" ]]; then
            echo 'SHA-256 is empty.' >&2
            exit 1
          fi

          if [[ -z "$FILE_SIZE" ]]; then
            echo 'File size is empty.' >&2
            exit 1
          fi

          if [[ ! -f release_versions.json ]]; then
            echo 'release_versions.json is missing from the version branch.' >&2
            exit 1
          fi

          python '.github/workflows/scripts/update_release_versions.py' \
            "$RELEASE_TAG" \
            "${prerelease_arg[@]}" \
            --release-url "$RELEASE_URL" \
            --download-url "$DOWNLOAD_URL" \
            --sha256 "$SHA256" \
            --file-size "$FILE_SIZE" \
            --linux-download-url "$LINUX_DOWNLOAD_URL" \
            --linux-sha256 "$LINUX_SHA256" \
            --linux-file-size "$LINUX_FILE_SIZE"

          rm -rf .github

          unexpected_changes=$(git status --porcelain --untracked-files=all -- ':!release_versions.json')
          if [[ -n "$unexpected_changes" ]]; then
            echo 'Unexpected files changed while updating release_versions.json:' >&2
            echo "$unexpected_changes" >&2
            exit 1
          fi

      - name: Commit and push release version data
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add release_versions.json
          if git diff --cached --quiet; then
            echo 'release_versions.json is already up to date.'
            exit 0
          fi

          git commit -m "Update release_versions.json for ${{ github.event.release.tag_name }}"
          git push origin version
